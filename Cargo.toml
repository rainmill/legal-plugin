[package]
name = "rainmill-legal"
version = "0.1.0"
description = "Versioned legal documents for Laterite: drafts with undo, published versions with archival PDFs, public history and diffs, acceptances and change notices"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rainmill/legal-plugin"

# Marks this crate as a Laterite plugin and names the module it registers.
[package.metadata.laterite]
plugin = "rainmill.legal"

[dependencies]
# Laterite crates are version-only; the building workspace patches them to the
# local checkout until Laterite publishes.
laterite-core = "0.10"
laterite-admin = "0.10"
# PDFs of drafts and published versions, set in a PDF layout.
rainmill-pdf = "0.1"
# A version's stored PDF is a media record linked to it.
laterite-media = "0.10"
# The site component that shows a document, its history and its changes.
laterite-web = "0.10"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The hash a published version carries, the same algorithm the media library uses.
blake3 = "1"

[dev-dependencies]
laterite-core = { version = "0.10", features = ["sqlite", "postgres", "testing"] }
laterite-auth = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
lopdf = { version = "0.47", default-features = false }
